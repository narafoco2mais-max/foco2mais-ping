name: Atividade mensal

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gravar data
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ultima-atividade.txt
          git config user.name "foco2mais-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ultima-atividade.txt
          git commit -m "Atividade mensal (mantém o agendamento ativo)"
          git push
